<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi Eye — Remote Desktop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #09090b;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f4f4f5;
    }
    #viewport {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      outline: none;
    }
    #remoteVideo {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: auto;
      outline: none;
    }
    /* Single Cursor Mode (Default): Hides the local OS mouse pointer over the remote desktop,
       completely eliminating the annoying double mouse cursor so only the partner's actual cursor is visible. */
    body.mode-single #viewport,
    body.mode-single #remoteVideo {
      cursor: none !important;
    }
    /* Dual Cursor Mode: Keeps both local and remote pointers visible if explicitly toggled */
    body.mode-dual #viewport,
    body.mode-dual #remoteVideo {
      cursor: default !important;
    }
    /* Toolbar and interactive overlays always show a standard pointer */
    #toolbar, #toolbar *, #loadingOverlay, #loadingOverlay * {
      cursor: default !important;
    }
    .btn {
      cursor: pointer !important;
    }
    /* Floating top toolbar */
    #toolbar {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 18, 24, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #toolbar.hidden {
      opacity: 0;
      transform: translate(-50%, -20px);
      pointer-events: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: #fff;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.15); }
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f4f4f5;
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.35);
      color: #fff;
    }
    #loadingOverlay {
      position: absolute;
      inset: 0;
      background: #09090b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 500;
      transition: opacity 0.4s ease;
    }
    #loadingOverlay.done {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #f43f5e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div id="loadingText" style="font-size: 13.5px; font-weight: 500; color: #a1a1aa;">
      Connecting to partner's desktop...
    </div>
  </div>

  <div id="toolbar">
    <div class="badge">
      <span class="badge-dot"></span>
      <span id="partnerTitle">Mochi Eye — Controlling Partner's PC</span>
    </div>
    <span class="badge" id="dataChannelBadge" style="font-size: 11px; opacity: 0.85; font-weight: 500;" title="P2P DataChannel state">⚡ Direct P2P</span>
    <button class="btn" id="btnCursorMode" title="Toggle Cursor: Single (Remote Only) vs Dual (Local + Remote) [Ctrl+Shift+C]">🖱️ Cursor: Single</button>
    <button class="btn" id="btnFullscreen" title="Toggle Fullscreen (F11)">⛶ Fullscreen</button>
    <button class="btn btn-danger" id="btnDisconnect" title="End remote access">🛑 End Session</button>
  </div>

  <div id="viewport" tabindex="0">
    <video id="remoteVideo" autoplay playsinline muted tabindex="0"></video>
  </div>

  <script>
    const video = document.getElementById("remoteVideo");
    const viewport = document.getElementById("viewport");
    const toolbar = document.getElementById("toolbar");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const loadingText = document.getElementById("loadingText");
    const partnerTitle = document.getElementById("partnerTitle");
    const dataChannelBadge = document.getElementById("dataChannelBadge");
    const btnCursorMode = document.getElementById("btnCursorMode");
    const btnFullscreen = document.getElementById("btnFullscreen");
    const btnDisconnect = document.getElementById("btnDisconnect");

    let peer = null;
    let dataChannel = null;
    let partnerName = "Partner";
    let remoteResolution = { width: 1920, height: 1080 };
    let hideToolbarTimer = null;

    // ── Cursor Mode (Single = Remote cursor only, Dual = Both local + remote) ───
    let cursorMode = localStorage.getItem("mochi_cursor_mode") || "single";

    function applyCursorMode(mode) {
      cursorMode = mode;
      localStorage.setItem("mochi_cursor_mode", mode);
      document.body.classList.remove("mode-single", "mode-dual");
      document.body.classList.add(mode === "single" ? "mode-single" : "mode-dual");
      if (btnCursorMode) {
        btnCursorMode.textContent = mode === "single" ? "🖱️ Cursor: Single" : "🖱️ Cursor: Dual";
        btnCursorMode.title = mode === "single"
          ? "Single Cursor Mode (Remote only — clean, eliminates double mouse). Click or press Ctrl+Shift+C to toggle Dual."
          : "Dual Cursor Mode (Both local and remote visible). Click or press Ctrl+Shift+C to toggle Single.";
      }
    }
    applyCursorMode(cursorMode);

    btnCursorMode.addEventListener("click", () => {
      applyCursorMode(cursorMode === "single" ? "dual" : "single");
    });

    // Auto-hide toolbar on mouse inactivity
    function pingToolbar() {
      toolbar.classList.remove("hidden");
      if (hideToolbarTimer) clearTimeout(hideToolbarTimer);
      hideToolbarTimer = setTimeout(() => {
        toolbar.classList.add("hidden");
      }, 3000);
    }
    window.addEventListener("mousemove", pingToolbar);
    toolbar.addEventListener("mouseenter", () => {
      if (hideToolbarTimer) clearTimeout(hideToolbarTimer);
      toolbar.classList.remove("hidden");
    });

    btnFullscreen.addEventListener("click", () => {
      window.viewerAPI.toggleFullscreen();
    });

    btnDisconnect.addEventListener("click", () => {
      window.viewerAPI.endSession();
    });

    // ── Input Event Capture & Forwarding ──────────────────────────────────────
    function sendCommand(cmd, isMove = false) {
      if (!cmd) return;
      if (dataChannel && dataChannel.readyState === "open") {
        try {
          // If network buffer is congested, drop stale mouse moves so input never lags behind
          if (isMove && dataChannel.bufferedAmount > 8192) {
            return;
          }
          dataChannel.send(cmd);
          return;
        } catch (e) {
          console.warn("[RemoteViewer] DataChannel send error:", e);
        }
      }
      // Critical: Only send discrete clicks/keys over fallback, never spam raw 60fps moves to cloud
      if (!isMove) {
        if (window.viewerAPI && window.viewerAPI.sendInputFast) {
          window.viewerAPI.sendInputFast(cmd);
        } else {
          window.viewerAPI.sendInput(cmd);
        }
      }
    }

    // ── Cached Render Metrics (Avoids getBoundingClientRect layout thrashing) ───
    let cachedMetrics = null;

    function updateMetrics() {
      if (!video) return;
      const rect = video.getBoundingClientRect();
      const videoWidth = video.videoWidth || remoteResolution.width || 1920;
      const videoHeight = video.videoHeight || remoteResolution.height || 1080;

      const rectRatio = rect.width / (rect.height || 1);
      const videoRatio = videoWidth / (videoHeight || 1);

      let renderWidth = rect.width;
      let renderHeight = rect.height;
      let offsetX = 0;
      let offsetY = 0;

      if (rectRatio > videoRatio) {
        renderWidth = rect.height * videoRatio;
        offsetX = (rect.width - renderWidth) / 2;
      } else {
        renderHeight = rect.width / videoRatio;
        offsetY = (rect.height - renderHeight) / 2;
      }

      cachedMetrics = {
        left: rect.left,
        top: rect.top,
        width: rect.width,
        height: rect.height,
        renderWidth,
        renderHeight,
        offsetX,
        offsetY,
        videoWidth,
        videoHeight,
      };
    }

    function getNormalizedCoords(e) {
      if (!cachedMetrics) updateMetrics();
      const m = cachedMetrics;

      const clientX = e.clientX - m.left - m.offsetX;
      const clientY = e.clientY - m.top - m.offsetY;

      const normX = Math.max(0, Math.min(1, clientX / (m.renderWidth || 1)));
      const normY = Math.max(0, Math.min(1, clientY / (m.renderHeight || 1)));

      const targetX = Math.round(normX * m.videoWidth);
      const targetY = Math.round(normY * m.videoHeight);

      return { normX, normY, x: targetX, y: targetY };
    }

    window.addEventListener("resize", updateMetrics);
    video.addEventListener("loadedmetadata", updateMetrics);
    video.addEventListener("resize", updateMetrics);

    // ── Ultra-Responsive Mouse Movement Dispatcher ────────────────────────────
    let lastMoveSentTime = 0;
    let pendingMove = null;
    let moveTimer = null;
    const MOVE_INTERVAL_MS = 10; // ~100Hz max update rate for fluid, real-time tracking

    function flushPendingMove() {
      if (moveTimer) {
        clearTimeout(moveTimer);
        moveTimer = null;
      }
      if (pendingMove) {
        sendCommand(`mn ${pendingMove.normX.toFixed(4)} ${pendingMove.normY.toFixed(4)}`, true);
        lastMoveSentTime = performance.now();
        pendingMove = null;
      }
    }

    video.addEventListener("mousemove", (e) => {
      const pos = getNormalizedCoords(e);
      const now = performance.now();
      const elapsed = now - lastMoveSentTime;

      // First movement or enough time elapsed: dispatch IMMEDIATELY with zero lag!
      if (elapsed >= MOVE_INTERVAL_MS) {
        if (moveTimer) {
          clearTimeout(moveTimer);
          moveTimer = null;
        }
        sendCommand(`mn ${pos.normX.toFixed(4)} ${pos.normY.toFixed(4)}`, true);
        lastMoveSentTime = now;
        pendingMove = null;
      } else {
        // High-frequency move: queue latest coordinate and flush at boundary
        pendingMove = pos;
        if (!moveTimer) {
          moveTimer = setTimeout(flushPendingMove, Math.max(1, MOVE_INTERVAL_MS - elapsed));
        }
      }
    });

    video.addEventListener("mouseleave", () => {
      flushPendingMove();
    });

    video.addEventListener("mousedown", (e) => {
      video.focus();
      flushPendingMove();
      const pos = getNormalizedCoords(e);
      const btn = e.button === 0 ? 1 : e.button === 2 ? 2 : 3;
      sendCommand(`d ${btn} ${pos.normX.toFixed(4)} ${pos.normY.toFixed(4)}`);
    });

    window.addEventListener("mouseup", (e) => {
      flushPendingMove();
      const pos = getNormalizedCoords(e);
      const btn = e.button === 0 ? 1 : e.button === 2 ? 2 : 3;
      sendCommand(`u ${btn} ${pos.normX.toFixed(4)} ${pos.normY.toFixed(4)}`);
    });

    video.addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = Math.round(-e.deltaY);
      sendCommand(`w ${delta}`);
    }, { passive: false });

    video.addEventListener("contextmenu", (e) => {
      e.preventDefault(); // Suppress local context menu
    });

    // Keyboard capture
    window.addEventListener("keydown", (e) => {
      if (e.key === "F11") {
        e.preventDefault();
        window.viewerAPI.toggleFullscreen();
        return;
      }
      if (e.ctrlKey && e.shiftKey && (e.key === "C" || e.key === "c")) {
        e.preventDefault();
        applyCursorMode(cursorMode === "single" ? "dual" : "single");
        pingToolbar();
        return;
      }
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "i"))) {
        return; // Allow DevTools
      }
      e.preventDefault();
      sendCommand(`k ${e.keyCode} 1`);
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "F11" || e.key === "F12") return;
      e.preventDefault();
      sendCommand(`k ${e.keyCode} 0`);
    });

    // Release keys and mouse buttons if window loses focus
    window.addEventListener("blur", () => {
      sendCommand("u 1");
      sendCommand("u 2");
      sendCommand("u 3");
      sendCommand("k 16 0"); // Shift
      sendCommand("k 17 0"); // Ctrl
      sendCommand("k 18 0"); // Alt
    });

    // ── WebRTC Receiver Setup ──────────────────────────────────────────────────
    function setupChannel(ch) {
      if (!ch) return;
      ch.binaryType = "arraybuffer";
      ch.onopen = () => {
        console.log("[RemoteViewer] P2P Ultra-Low Latency DataChannel OPEN:", ch.label);
        dataChannel = ch;
        if (dataChannelBadge) {
          dataChannelBadge.textContent = "⚡ P2P Direct (Fast)";
          dataChannelBadge.style.color = "#4ade80";
        }
      };
      ch.onclose = () => {
        console.log("[RemoteViewer] DataChannel closed:", ch.label);
        if (dataChannel === ch) dataChannel = null;
        if (dataChannelBadge) {
          dataChannelBadge.textContent = "⚠️ Reconnecting...";
          dataChannelBadge.style.color = "#f87171";
        }
      };
      ch.onerror = (err) => {
        console.warn("[RemoteViewer] DataChannel error:", err);
      };
      if (ch.readyState === "open") {
        dataChannel = ch;
        if (dataChannelBadge) {
          dataChannelBadge.textContent = "⚡ P2P Direct (Fast)";
          dataChannelBadge.style.color = "#4ade80";
        }
      }
    }

    const ICE_SERVERS = [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "stun:stun2.l.google.com:19302" },
      { urls: "stun:stun3.l.google.com:19302" },
      { urls: "stun:stun4.l.google.com:19302" },
      { urls: "stun:stun.cloudflare.com:3478" },
      { urls: "stun:stun.services.mozilla.com" },
    ];

    let pendingHostCandidates = [];
    let hasSetRemoteDesc = false;
    let queuedSignals = [];
    let viewerGatheredCandidates = [];

    async function addCandidate(candidate) {
      if (!candidate) return;
      if (!hasSetRemoteDesc || !peer || !peer.remoteDescription) {
        pendingHostCandidates.push(candidate);
        return;
      }
      try {
        await peer.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (err) {
        console.warn("[RemoteViewer] Error adding ICE candidate:", err);
      }
    }

    async function handleOffer(offer) {
      if (!offer || !offer.sdp || !peer) return;
      try {
        console.log("[RemoteViewer] Processing SDP Offer from partner...");
        loadingText.textContent = `Connecting to ${partnerName}'s desktop stream...`;

        if (peer.signalingState !== "stable") {
          console.warn("[RemoteViewer] Non-stable signaling state:", peer.signalingState, "rolling back");
          try {
            await peer.setLocalDescription({ type: "rollback" });
          } catch (rbErr) {}
        }

        await peer.setRemoteDescription(new RTCSessionDescription(offer));
        hasSetRemoteDesc = true;

        // Apply pre-gathered host candidates bundled in the offer
        if (offer.candidates && Array.isArray(offer.candidates)) {
          console.log("[RemoteViewer] Applying bundled host candidates count:", offer.candidates.length);
          for (const c of offer.candidates) {
            await addCandidate(c);
          }
        }

        // Flush queued host candidates
        while (pendingHostCandidates.length > 0) {
          const cand = pendingHostCandidates.shift();
          await addCandidate(cand);
        }

        const answer = await peer.createAnswer();
        await peer.setLocalDescription(answer);

        // Wait up to 600ms (or until complete) so viewer's STUN candidates are bundled
        await new Promise((resolve) => {
          let done = false;
          const finish = () => {
            if (!done) {
              done = true;
              resolve();
            }
          };
          if (peer.iceGatheringState === "complete") {
            finish();
            return;
          }
          const checkState = () => {
            if (peer.iceGatheringState === "complete") finish();
          };
          peer.addEventListener("icegatheringstatechange", checkState);
          setTimeout(finish, 600);
        });

        window.viewerAPI.sendSignal({
          type: "answer",
          sdp: peer.localDescription ? peer.localDescription.sdp : answer.sdp,
          candidates: viewerGatheredCandidates.slice(),
        });
        console.log("[RemoteViewer] Sent SDP Answer with bundled candidates count:", viewerGatheredCandidates.length);
      } catch (err) {
        console.error("[RemoteViewer] handleOffer error:", err);
        loadingText.textContent = "Negotiation error: " + err.message;
      }
    }

    async function routeSignal(signal) {
      if (!signal) return;
      if (!peer) {
        queuedSignals.push(signal);
        return;
      }
      try {
        if (signal.type === "offer") {
          await handleOffer(signal);
        } else if (signal.type === "candidate") {
          await addCandidate(signal.candidate);
        } else if (signal.type === "resolution") {
          remoteResolution = signal.resolution;
        }
      } catch (e) {
        console.warn("[RemoteViewer] routeSignal error:", e);
      }
    }

    function revealVideo() {
      console.log("[RemoteViewer] Video feed is active, revealing live stream!");
      loadingOverlay.classList.add("done");
      pingToolbar();
      video.focus();
    }

    async function initWebRTC() {
      try {
        // 1. Immediately register listener for main process signals so no signals are dropped
        window.viewerAPI.on("viewer-signal", (signal) => {
          void routeSignal(signal);
        });

        const info = await window.viewerAPI.getPartnerInfo();
        if (info && info.partnerName) {
          partnerName = info.partnerName;
          partnerTitle.textContent = `Mochi Eye — Controlling ${partnerName}'s PC`;
          loadingText.textContent = `Connecting to ${partnerName}'s desktop...`;
        }
        if (info && info.remoteResolution) {
          remoteResolution = info.remoteResolution;
        }

        peer = new RTCPeerConnection({
          iceServers: ICE_SERVERS,
          iceCandidatePoolSize: 10,
        });

        peer.ondatachannel = (e) => {
          setupChannel(e.channel);
        };

        // Robust track assignment supporting streams array and individual tracks
        peer.ontrack = (e) => {
          console.log("[RemoteViewer] Received remote track:", e.track ? e.track.kind : "unknown", e.streams);
          if (e.streams && e.streams[0]) {
            video.srcObject = e.streams[0];
          } else {
            let stream = video.srcObject;
            if (!stream || !(stream instanceof MediaStream)) {
              stream = new MediaStream();
              video.srcObject = stream;
            }
            stream.addTrack(e.track);
          }

          video.play().catch((err) => {
            console.warn("[RemoteViewer] video.play() error:", err);
          });
        };

        // Multiple event listeners to reveal live video as early as possible
        video.addEventListener("playing", revealVideo);
        video.addEventListener("loadeddata", revealVideo);
        video.addEventListener("loadedmetadata", () => {
          revealVideo();
          video.play().catch(() => {});
        });
        video.addEventListener("canplay", () => {
          revealVideo();
          video.play().catch(() => {});
        });

        // Polling fallback: if video is rendering frames, force reveal
        const checkInterval = setInterval(() => {
          if (video.videoWidth > 0 && video.videoHeight > 0) {
            revealVideo();
            clearInterval(checkInterval);
          }
        }, 350);

        let iceCheckingTimer = null;
        peer.oniceconnectionstatechange = () => {
          const st = peer.iceConnectionState;
          console.log("[RemoteViewer] ICE connection state:", st);
          if (st === "checking") {
            loadingText.textContent = "Routing connection to partner...";
            if (iceCheckingTimer) clearTimeout(iceCheckingTimer);
            iceCheckingTimer = setTimeout(() => {
              if (peer && (peer.iceConnectionState === "checking" || peer.iceConnectionState === "disconnected")) {
                console.warn("[RemoteViewer] Still checking after 6s, requesting refreshed route...");
                loadingText.textContent = "Optimizing route to partner...";
                try {
                  window.viewerAPI.sendSignal({ type: "ready" });
                } catch (e) {}
              }
            }, 6000);
          } else if (st === "connected" || st === "completed") {
            if (iceCheckingTimer) clearTimeout(iceCheckingTimer);
            loadingText.textContent = "Media route active! Starting display...";
            video.play().catch(() => {});
          } else if (st === "failed") {
            if (iceCheckingTimer) clearTimeout(iceCheckingTimer);
            console.warn("[RemoteViewer] ICE failed, attempting restart...");
            loadingText.textContent = "Re-establishing connection route...";
            try {
              peer.restartIce();
              window.viewerAPI.sendSignal({ type: "ready" });
            } catch (e) {}
          } else if (st === "disconnected") {
            loadingText.textContent = "Reconnecting to partner...";
          }
        };

        peer.onconnectionstatechange = () => {
          const st = peer.connectionState;
          console.log("[RemoteViewer] Peer connection state:", st);
          if (st === "connected") {
            loadingText.textContent = "Connected! Rendering desktop...";
            video.play().catch(() => {});
          } else if (st === "failed") {
            loadingText.textContent = "Connection to partner failed. Please end session and retry.";
            loadingOverlay.classList.remove("done");
          }
        };

        peer.onicecandidate = (e) => {
          if (e.candidate) {
            const c = e.candidate.toJSON ? e.candidate.toJSON() : e.candidate;
            viewerGatheredCandidates.push(c);
            if (hasSetRemoteDesc) {
              window.viewerAPI.sendSignal({ type: "candidate", candidate: c });
            }
          }
        };

        // Drain any signals that arrived while peer was being constructed
        while (queuedSignals.length > 0) {
          const sig = queuedSignals.shift();
          await routeSignal(sig);
        }

        // If host's initial offer was passed during window creation, process it immediately!
        if (info && info.initialOffer) {
          console.log("[RemoteViewer] Processing initial SDP offer from partner info");
          await handleOffer(info.initialOffer);
          if (info.initialOffer.candidates && Array.isArray(info.initialOffer.candidates)) {
            for (const c of info.initialOffer.candidates) {
              await addCandidate(c);
            }
          }
        }

        // Notify host that viewer window is ready
        window.viewerAPI.sendSignal({ type: "ready" });

        // Backup retry: If after 5s video is still not showing, re-signal ready
        setTimeout(() => {
          if (!loadingOverlay.classList.contains("done") && peer && peer.iceConnectionState !== "connected") {
            console.log("[RemoteViewer] 5s check: Stream not yet active, pinging host ready signal...");
            window.viewerAPI.sendSignal({ type: "ready" });
          }
        }, 5000);
      } catch (err) {
        console.error("[RemoteViewer] Init error:", err);
        loadingText.textContent = "Connection failed: " + err.message;
      }
    }

    initWebRTC();
  </script>
</body>
</html>
